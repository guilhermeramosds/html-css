<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador.</p>
    
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-p.jpg" type="image/jpg">
        <source media="(max-width: 1050px)" srcset="imagens/imagem-m.jpg" type="image/jpg">
        <img src="imagens/imagem-g.jpg" alt="imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    
    <audio preload="metadata" controls loop>
        <source src="midia/rock-intro-audionautix.mp3" type="audio/mpeg">
        <source src="midia/rock-intro-audionautix.ogg" type="audio/ogg">
        <source src="midia/rock-intro-audionautix.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir o áudio. <a href="midia/rock-intro-audionautix.mp3" download="rock-intro-audionautix.mp3">Clique aqui para baixar o arquivo MP3</a></p>
    </audio>
</body>
</html>
